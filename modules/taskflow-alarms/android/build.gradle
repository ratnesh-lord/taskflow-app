plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ratnesh.taskflow'
version = '1.0.0'

android {
  namespace "com.ratnesh.taskflow.alarms"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Widget taps start the app's background task (expo-background-task) through WorkManager.
  // Expo links that module either as source or, by default, as a prebuilt package.
  def backgroundTask = rootProject.findProject(':expo-background-task')
  if (backgroundTask != null) {
    implementation backgroundTask
  } else {
    def pkg = new groovy.json.JsonSlurper().parse(new File(rootProject.projectDir, '../node_modules/expo-background-task/package.json'))
    implementation "host.exp.exponent:expo.modules.backgroundtask:${pkg.version}"
  }
  implementation 'androidx.work:work-runtime-ktx:2.10.5'
}
