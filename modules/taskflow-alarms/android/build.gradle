plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ratnesh.taskflow'
version = '1.0.0'

android {
  namespace "com.ratnesh.taskflow.alarms"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Widget taps start the app's background task (expo-background-task) through WorkManager.
  implementation project(':expo-background-task')
  implementation 'androidx.work:work-runtime-ktx:2.10.5'
}
