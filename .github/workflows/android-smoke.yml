# Android smoke test: builds the release app for an x86_64 emulator, starts it
# on Android 15, and fails if it crashes. Then checks the home-screen widgets
# (scripts/ci/android-widgets.sh). The emulator's log (filtered to the
# app) and a screenshot are kept as an artifact named android-smoke.
#
# The phone build in ci.yml is ARM-only; this separate build exists only so
# the very same release code can run on a CI emulator. It is signed with a
# throwaway key, to prove release signing works without touching the real key.

name: Android smoke test

on:
  pull_request:
  push:
    branches: ['fix-*', 'phase-*']
  workflow_dispatch:

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Start the app on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY || secrets.EXPO_PUBLIC_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - name: Make a throwaway signing key
        id: key
        # Proves the release-signing path (plugins/with-release-signing.js) with
        # a key that exists only in this job; the real key is never used here.
        run: bash scripts/ci/release-key.sh throwaway
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK for the emulator (x86_64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Check it is signed with that key
        run: bash scripts/ci/release-key.sh verify android/app/build/outputs/apk/release/app-release.apk release
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, start, and watch for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash scripts/ci/android-smoke.sh android/app/build/outputs/apk/release/app-release.apk com.ratnesh.taskflow smoke-out
            bash scripts/ci/android-widgets.sh com.ratnesh.taskflow smoke-out
            bash scripts/ci/android-startup.sh com.ratnesh.taskflow smoke-out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-smoke
          path: smoke-out/
          retention-days: 14
