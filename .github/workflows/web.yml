name: Publish the web app

# Builds the web app and publishes it on GitHub Pages, at
# https://<owner>.github.io/<repository>/, after CI passes on main.
# One-time setup (docs/DEPLOY.md): Settings > Pages > Source: GitHub Actions.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the web app
    # Only a CI run on main that passed (a manual run always builds).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # Public values, the same ones the APK is built with (see ci.yml).
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY || secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      # Optional: Google Calendar, Tasks and Drive in the browser (docs/SETUP.md, 6b).
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      TASKFLOW_WEB_BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check the app's Supabase settings
        run: bash scripts/ci/check-app-settings.sh strict
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          npx expo export --platform web --output-dir site
          bash scripts/web/finish-export.sh site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
