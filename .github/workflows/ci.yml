name: CI

# Every push and pull request: test the database, test the app, check the web app
# end to end, and build an installable Android APK.

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      REQUIRE_SYNC_TESTS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations and run the tests
        run: bash supabase/tests/run.sh

  app:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (includes the no-rounded-corners rule)
        run: npm run lint
      - name: Unit and screen tests
        run: npm test
      - name: Tests for the app-settings check
        run: bash scripts/ci/check-app-settings.test.sh
      - name: Bundle for Android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_placeholder_for_bundle_check
        run: npx expo export --platform android --output-dir dist-check

  web-e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install playwright
      - name: Drive the web app in Chrome against a real database
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-screens
          E2E_API_LOG: ${{ runner.temp }}/e2e-api.log
        run: bash scripts/e2e/run.sh
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: web-e2e-screens
          path: |
            ${{ runner.temp }}/e2e-screens
            ${{ runner.temp }}/e2e-api.log
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [app]
    permissions:
      contents: write
    env:
      # The two values built into the app. Both are public by design (the key is
      # the publishable one). They belong under Settings > Secrets and variables >
      # Actions > Variables; saved as secrets instead, they are picked up too.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY || secrets.EXPO_PUBLIC_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the app's Supabase settings
        id: settings
        # Builds from main get published, so wrong settings stop them here, in
        # seconds, with a message saying what to fix. Other builds only warn.
        run: bash scripts/ci/check-app-settings.sh ${{ github.ref == 'refs/heads/main' && 'strict' || 'warn' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK (64-bit ARM, which every current phone uses)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/taskflow-${GITHUB_SHA::7}.apk"
          ls -la out
      - uses: actions/upload-artifact@v5
        with:
          name: taskflow-apk
          path: out/*.apk
          retention-days: 30
      - name: Publish as the Latest release (main only, pushes and manual runs)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_HOST: ${{ steps.settings.outputs.host }}
          GOOGLE: ${{ steps.settings.outputs.google }}
          CONFIRM_EMAIL: ${{ steps.settings.outputs.confirm_email }}
        run: |
          cp out/taskflow-*.apk out/taskflow-latest.apk
          {
            echo "Built from ${GITHUB_SHA::7} on $(date -u '+%d %b %Y, %H:%M UTC')."
            echo
            echo "Connects to ${APP_HOST}. Google sign-in: ${GOOGLE}. Email confirmation: ${CONFIRM_EMAIL}."
            echo
            echo "**To install or update:** open this page on the phone, tap **taskflow-latest.apk**, then open the download. A new build installs over the previous one."
          } > release-notes.md
          # Replace the previous build, so the release and its tag always point at this commit.
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-build out/taskflow-latest.apk \
            --target "$GITHUB_SHA" --title "TaskFlow latest build" --notes-file release-notes.md --latest
